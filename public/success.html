<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed | TAPP Tours</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 font-sans min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-sm border border-stone-200 text-center space-y-4">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">✓</div>
        <h1 class="text-2xl font-extrabold text-stone-900">Payment Successful!</h1>
        <p id="statusMessage" class="text-stone-600 text-sm">Verifying your payment and sending confirmation details...</p>
        <div class="pt-4">
            <a href="index.html" class="inline-block bg-emerald-800 hover:bg-emerald-900 text-white font-bold px-6 py-3 rounded-xl text-sm transition-all shadow-md">
                Return to Homepage
            </a>
        </div>
    </div>

    <script>
        async function verifyPaymentSession() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session_id');
            const statusMsg = document.getElementById('statusMessage');

            if (!sessionId) {
                statusMsg.innerText = "Thank you for booking with TAPP Tours! Your reservation has been recorded.";
                return;
            }

            try {
                const res = await fetch('/api/verify-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    statusMsg.innerText = "Payment verified successfully! Confirmation emails have been sent to you and the admin.";
                } else {
                    statusMsg.innerText = data.error || "Payment completed, but verification notice was delayed.";
                }
            } catch (err) {
                console.error("Verification error:", err);
                statusMsg.innerText = "Thank you! Your payment was received.";
            }
        }

        verifyPaymentSession();
    </script>
</body>
</html>
