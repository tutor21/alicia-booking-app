<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed | Alicia Panoramic Park</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 font-sans min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-stone-200 p-8 text-center">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto mb-5 shadow-sm">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
        </div>

        <span class="text-xs font-bold uppercase tracking-widest text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200">Payment Verified</span>
        
        <h1 class="text-2xl font-bold text-stone-900 mt-4 mb-2">Booking Confirmed!</h1>
        <p class="text-stone-600 text-sm mb-6 leading-relaxed">
            Thank you for booking with <strong>Alicia Panoramic Park</strong>. Your payment was successfully processed and verified.
        </p>

        <div id="sessionBox" class="bg-stone-50 p-3.5 rounded-xl border border-stone-200 text-xs text-stone-500 font-mono mb-6 hidden">
            Session ID: <span id="sessionIdText" class="text-stone-800 font-bold"></span>
        </div>

        <p class="text-xs text-stone-500 mb-8">
            A confirmation receipt and tour guide instructions have been sent to your email.
        </p>

        <a href="index.html" class="inline-block w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-3.5 rounded-xl transition-all shadow-md text-sm">
            Return to Homepage
        </a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        if (sessionId) {
            document.getElementById('sessionIdText').innerText = sessionId;
            document.getElementById('sessionBox').classList.remove('hidden');
        }
    </script>
</body>
</html>
