<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alicia Panoramic Park Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4">Book Your Tour</h3>
                        <form id="bookingForm">
                            <div class="mb-3">
                                <label for="tour" class="form-label">Select Package</label>
                                <select id="tour" name="tour" required class="form-control">
                                    <option value="" disabled selected>Select Tour</option>
                                    <option value="Alicia Panoramic Park Tour">Alicia Panoramic Park Tour (₱750.00 / guest)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="customerName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="customerName" name="customerName" required>
                            </div>
                            <div class="mb-3">
                                <label for="customerEmail" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="customerEmail" name="customerEmail" required>
                            </div>
                            <div class="mb-3">
                                <label for="customerPhone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="customerPhone" name="customerPhone" required>
                            </div>
                            <div class="mb-3">
                                <label for="bookingDate" class="form-label">Booking Date</label>
                                <input type="date" class="form-control" id="bookingDate" name="bookingDate" required>
                            </div>
                            <div class="mb-3">
                                <label for="guests" class="form-label">Number of Guests</label>
                                <input type="number" class="form-control" id="guests" name="guests" value="1" min="1" max="10" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="submitBtn">Proceed to Payment</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Connecting to Payment...';

            const formData = {
                tour: document.getElementById('tour').value,
                customerName: document.getElementById('customerName').value,
                customerEmail: document.getElementById('customerEmail').value,
                customerPhone: document.getElementById('customerPhone').value,
                bookingDate: document.getElementById('bookingDate').value,
                guests: document.getElementById('guests').value
            };

            try {
                const response = await fetch('/api/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const data = await response.json();

                if (response.ok && data.checkoutUrl) {
                    window.location.href = data.checkoutUrl;
                } else {
                    alert(data.error || 'Payment initialization failed.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Proceed to Payment';
                }
            } catch (err) {
                console.error('Error:', err);
                alert('An error occurred connecting to the server.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Proceed to Payment';
            }
        });
    </script>
</body>
</html>
